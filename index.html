<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dirty Marbles</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <header>
    <div>
      <h1>Dirty Marbles</h1>
      <p>Local game. One card, then the turn passes.</p>
    </div>
    <label>Players
      <select id="count">
        <option>2</option>
        <option>3</option>
        <option selected>4</option>
        <option>5</option>
        <option>6</option>
      </select>
    </label>
    <label>Cards
      <select id="hand-size">
        <option selected>5</option>
        <option>6</option>
        <option>7</option>
      </select>
    </label>
  </header>
  <main>
    <svg id="board" aria-label="Dirty Marbles board"></svg>
    <aside>
      <p id="turn" class="turn">Loading board…</p>
      <p id="status">Loading board…</p>
      <button id="restart" type="button">New game</button>
      <p id="confirm" hidden>Start a new game? The current game will be lost. <button id="confirm-yes" type="button">Yes</button> <button id="confirm-no" type="button">No</button></p>
      <label class="option"><input id="no-jokers" type="checkbox"> No jokers</label>
      <label class="option"><input id="safe-start" type="checkbox"> Start is safe</label>
      <h2>Hand</h2>
      <div id="hand"></div>
      <h2>Seats</h2>
      <ul id="seats"></ul>
      <h2>Locked rules</h2>
      <ul id="rules"></ul>
    </aside>
  </main>
  <footer>Hot-seat on this computer. Room codes are not in yet.</footer>
  <script src="js/layouts.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/board.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
